<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI Sprint Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="topbar">
        <h1>PI Sprint Planner</h1>
        <div class="actions">
            <button id="addFeature" type="button" class="primary">+ Add Feature</button>
            <button id="addSprint" type="button" class="primary">+ Add Sprint</button>
            <div class="menu" id="exportMenu">
                <button id="exportBtn" type="button" class="ghost" aria-haspopup="true"
                    aria-expanded="false">Export ▾</button>
                <div class="menu-list" role="menu" hidden>
                    <button type="button" role="menuitem" data-export="json">JSON (re-importable)</button>
                    <button type="button" role="menuitem" data-export="csv">CSV (spreadsheet)</button>
                    <button type="button" role="menuitem" data-export="xlsx">Excel (.xlsx, colored)</button>
                    <button type="button" role="menuitem" data-export="md">Markdown table (Confluence)</button>
                    <button type="button" role="menuitem" data-export="jpg">JPG image</button>
                </div>
            </div>
            <button id="importBtn" type="button" class="ghost">Import</button>
            <button id="themeBtn" type="button" class="ghost">Dark mode</button>
            <button id="resetBtn" type="button" class="danger">Reset</button>
            <input type="file" id="importFile" accept="application/json" hidden>
        </div>
    </header>

    <main>
        <div id="board" class="board"></div>
    </main>

    <p class="hint">Drag stories between the backlog and sprint cells. Click a story title or points to edit.</p>

    <script src="app.js"></script>
</body>

</html>
